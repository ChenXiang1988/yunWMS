name: CI

# 所有分支的推送都跑一次校验：change/*、fix/* 等命名规则都可能变，
# 白名单式触发容易漏（本次就漏过 fix/ 分支），代价是少量免费额度
on:
  push:
  pull_request:

# 同一分支的新推送会取消上一次未跑完的任务，避免排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端校验
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11.25 要求 Node >= 22.13，且 runner 上的 Node 20 已弃用
          node-version: 22
          cache: pnpm
          cache-dependency-path: code/frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm -r typecheck

      # 只有声明了 test 脚本的包会被执行；当前仅 @yunwms/tokens
      - name: 单元测试
        run: pnpm -r test

      - name: 构建
        run: pnpm -r build

      - name: UI 边界
        run: pnpm check:ui

  tools:
    name: Python 工具测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: API 台账工具
        working-directory: code/tools/api-inventory
        run: python3 -m unittest discover -s tests

      - name: 安装 CAD 工具依赖
        working-directory: code/tools/cad-parser
        run: python -m pip install -r requirements.txt

      - name: CAD 解析工具
        working-directory: code/tools/cad-parser
        run: python3 -m unittest discover -s tests

      - name: 交付审计工具
        working-directory: code/tools/audit-delivery
        run: python3 -m unittest discover -s tests

  # 后端此前没有任何 CI：AGENTS.md 第 45 行要求的模块依赖拦截（ArchUnit）
  # 与全部单测、集成测试都只在本地跑。集成测试用 Testcontainers，
  # ubuntu-latest 自带 Docker；setup-java 的 cache 会自动找 **/pom.xml。
  backend:
    name: 后端校验
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: 编译与测试
        run: ./mvnw -B verify
