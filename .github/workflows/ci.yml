name: CI

on:
  push:
    branches:
      - main
      - 'change/**'
  pull_request:

# 同一分支的新推送会取消上一次未跑完的任务，避免排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端校验
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11.25 要求 Node >= 22.13，且 runner 上的 Node 20 已弃用
          node-version: 22
          cache: pnpm
          cache-dependency-path: code/frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm -r typecheck

      - name: 构建
        run: pnpm -r build
