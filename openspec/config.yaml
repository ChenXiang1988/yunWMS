schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  项目：yunWMS，多货主 3PL 云仓储管理系统。由 AI 编写全部代码，人类只做验收。
  技术栈：Java 21 + Spring Boot 3.x、MyBatis-Plus、PostgreSQL、Valkey、Vue 3 + Ant Design Vue 4。
  业务前提：多货主 3PL，tenant_id（系统租户）与 owner_id（货主）双维度；货位属仓库，库存属货主，同一货位可存放多货主货物。
  许可约束：默认零商业授权预算，GPL/AGPL/SSPL 依赖一律不得引入，包括 XXL-Job、JeeWMS、MySQL、Redis 7.4+。已批准的唯一付费组件为 hiprint 打印客户端（静默打印必需，用户自行采购），其余保持零授权。
  调研门禁：任何新功能域在实现前必须完成开源调研，产物落 docs/research/<主题>.md，并在 proposal 中引用。
  交付纪律：一个 change 只覆盖一个垂直切片；单次提交不超过 400 行；数据库迁移与代码变更分离；每次提交必须可编译、可运行。
  模块划分：wms-common、wms-master、wms-inbound、wms-inventory、wms-outbound、wms-task、wms-integration、wms-auth。

rules:
  proposal:
    - 必须引用 docs/research/<主题>.md；无调研文档不得进入实现
    - 明确写出本期范围与非目标，一个 change 不跨两个业务域
  specs:
    - 每个 Requirement 至少包含一个 Scenario
    - 需求文本保留 SHALL/MUST 英文关键词，正文用中文
  design:
    - 记录被否方案与落选原因
    - 数据库变更必须说明兼容策略，遵循先加字段、再写代码、最后删旧字段
  tasks:
    - 单条任务不超过半天，优先控制在 2 小时
    - 每条任务可独立验证，并写明验证方式
    - 数据库迁移与代码修改必须拆成不同任务
    - 任务按依赖顺序排列，前置任务未完成不得开工
