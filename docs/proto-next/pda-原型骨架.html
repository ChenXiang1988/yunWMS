        placeholder: '扫描或输入 SKU 编码', required: true,
        active: state.scan.active === 'pa-sku',
        msg: '扫描商品条码或手工输入 SKU，按 Enter 确认'
      })
    + pdaScanField({
        id: 'pa-rec', step: '2', label: '推荐库位（只读）', icon: 'location',
        value: sku.recLoc, readonly: true,
        msg: '推荐值不等于实际确认，请以实际扫描的库位为准'
      })
    + pdaScanField({
        id: 'pa-act', step: '3', label: '扫描实际库位', icon: 'location',
        placeholder: '扫描或输入实际库位码', required: true,
        active: state.scan.active === 'pa-act'
      })
    + pdaQuantityField({
        id: 'pa-good', step: '4', label: '良品数量', unit: sku.unit, plan: sku.planQty,
        active: state.scan.active === 'pa-good',
        quick: '全部良品', quickValue: String(sku.planQty)
      })
    + pdaQuantityField({
        id: 'pa-bad', step: '5', label: '不良品数量', unit: sku.unit,
        active: state.scan.active === 'pa-bad',
        quick: '清零', quickValue: '0'
      })
    + pdaCard('校验规则',
        pdaKv('实际库位', '须与推荐库位 ' + sku.recLoc + ' 一致')
      + pdaKv('数量合计', '良品 + 不良品 = 计划量 ' + sku.planQty + ' ' + sku.unit)
      + pdaKv('空值处理', '数量留空不等于 0，需明确填写'));

  return pdaPageShell({ type: 'scan-operation', body: body });
}

function mountPutawayScan() {
  var task = currentTask('putaway');
  if (!task) return;
  var job = jobState.putaway;
  var sku = task.skus[job.skuIndex];
  if (!sku) return;

  registerScan('pa-sku', function (v) {
    var code = cleanCode(v);
    if (!code) { scanErrors['pa-sku'] = '请扫描或输入 SKU 编码'; state.scan.active = 'pa-sku'; renderAll(); return; }
    if (code.toUpperCase() !== sku.sku.toUpperCase()) {
      var belongs = task.skus.some(function (s) { return s.sku.toUpperCase() === code.toUpperCase(); });
      scanErrors['pa-sku'] = belongs
        ? '请按顺序上架，当前应扫 ' + sku.sku
        : '该 SKU 不属于本任务：' + code + '，请核对后重扫';
      state.scan.active = 'pa-sku';
      renderAll();
      return;
    }
    scanErrors['pa-sku'] = '';
    state.scan.active = 'pa-act';
    renderAll();
    toast('SKU 已确认：' + sku.sku);
  }, sku.sku);

  registerScan('pa-act', function (v) {
    var code = cleanCode(v);
    if (!code) { scanErrors['pa-act'] = '请扫描实际库位'; state.scan.active = 'pa-act'; renderAll(); return; }
    if (code.toUpperCase() !== sku.recLoc.toUpperCase()) {
      scanErrors['pa-act'] = '库位与任务要求不一致，请扫描推荐库位 ' + sku.recLoc;
      state.scan.active = 'pa-act';
      renderAll();
      return;
    }
    scanErrors['pa-act'] = '';
    state.scan.active = 'pa-good';
    renderAll();
  }, sku.recLoc);

  registerScan('pa-good', function (v) {
    if (cleanCode(v) === '') {
      qtyErrors['pa-good'] = '良品数量不能为空（空值不等于 0）';
      state.scan.active = 'pa-good';
      renderAll();
      return;
    }
    qtyErrors['pa-good'] = '';
    state.scan.active = 'pa-bad';
    renderAll();
  });

  registerScan('pa-bad', function () { submitPutaway(); });
}

function submitPutaway() {
  var task = currentTask('putaway');
  if (!task) return;
  var job = jobState.putaway;
  var sku = task.skus[job.skuIndex];
  if (!sku) { switchPage('putaway-success'); return; }

  var actLoc = cleanCode(scanValues['pa-act']);
  if (!actLoc) {
    scanErrors['pa-act'] = '请先扫描实际库位';
    state.scan.active = 'pa-act'; renderAll(); return;
  }
  if (actLoc.toUpperCase() !== sku.recLoc.toUpperCase()) {
    scanErrors['pa-act'] = '库位与任务要求不一致，请扫描推荐库位 ' + sku.recLoc;
    state.scan.active = 'pa-act'; renderAll(); return;
  }

  var gRaw = qtyValues['pa-good'];
  var bRaw = qtyValues['pa-bad'];
  if (gRaw === undefined || gRaw === null || String(gRaw).trim() === '') {
    qtyErrors['pa-good'] = '良品数量不能为空（空值不等于 0）';
    state.scan.active = 'pa-good'; renderAll(); return;
  }
  if (bRaw === undefined || bRaw === null || String(bRaw).trim() === '') bRaw = '0';
  if (!/^\d+$/.test(String(gRaw).trim()) || !/^\d+$/.test(String(bRaw).trim())) {
    qtyErrors['pa-good'] = '良品与不良品数量须为整数';
    state.scan.active = 'pa-good'; renderAll(); return;
  }

  var g = parseInt(gRaw, 10), b = parseInt(bRaw, 10);
  if (g + b !== sku.planQty) {
    qtyErrors['pa-bad'] = '良品 ' + g + ' + 不良品 ' + b + ' = ' + (g + b)
      + '，应等于计划量 ' + sku.planQty + ' ' + sku.unit;
    state.scan.active = 'pa-bad'; renderAll(); return;
  }

  job.results.push({ sku: sku.sku, loc: actLoc, good: g, bad: b });
  job.skuIndex += 1;
  scanValues = {}; scanErrors = {}; qtyValues = {}; qtyErrors = {};

  if (job.skuIndex >= task.skus.length) {
    task.status = '已完成'; task.tone = 'success';
    task.progress.done = task.progress.total;
    switchPage('putaway-success');
    return;
  }
  state.scan.active = 'pa-sku';
  renderAll();
  toast('已记录 ' + sku.sku + '，进入下一个 SKU');
}

  registerScan('re-to', function (v) {

    if (code.toUpperCase() === task.fromLoc.toUpperCase()) {

function submitRelocation() {

function submitReplenish() {
  var task = currentTask('replenish');
  if (!task) return;

  var loc = cleanCode(scanValues['rp-loc']);
  if (!loc) { scanErrors['rp-loc'] = '请先扫描拣货位'; state.scan.active = 'rp-loc'; renderAll(); return; }
  if (loc.toUpperCase() !== task.toLoc.toUpperCase()) {
    scanErrors['rp-loc'] = '库位与任务要求不一致，请扫描拣货位 ' + task.toLoc;
    state.scan.active = 'rp-loc'; renderAll(); return;
  }
  var skuCode = cleanCode(scanValues['rp-sku']);
  if (!skuCode || skuCode.toUpperCase() !== task.sku.toUpperCase()) {
    scanErrors['rp-sku'] = '请先扫描正确的 SKU：' + task.sku;
    state.scan.active = 'rp-sku'; renderAll(); return;
  }

  var raw = qtyValues['rp-qty'];
  if (raw === undefined || raw === null || String(raw).trim() === '') {
    qtyErrors['rp-qty'] = '补货数量不能为空（空值不等于 0）';
    state.scan.active = 'rp-qty'; renderAll(); return;
  }
  if (!/^\d+$/.test(String(raw).trim())) {
    qtyErrors['rp-qty'] = '数量须为整数';
    state.scan.active = 'rp-qty'; renderAll(); return;
  }
  var q = parseInt(raw, 10);
  if (q <= 0) { qtyErrors['rp-qty'] = '数量须大于 0'; state.scan.active = 'rp-qty'; renderAll(); return; }
  if (q > task.planQty) {
    qtyErrors['rp-qty'] = '数量不得超过计划量 ' + task.planQty + ' ' + task.unit;
    state.scan.active = 'rp-qty'; renderAll(); return;
  }

  task.doneQty = q;
  task.status = '已完成'; task.tone = 'success';
  task.progress.done = q;
  switchPage('replenish-success');
}

      onSecondary: function () { toast('已加入本次作业（本地暂存，未提交服务器）'); },
      primary: '确认补货',
      onPrimary: submitReplenish
    },
    render: renderReplenishScan,
    mounted: mountReplenishScan
  },
  'replenish-success': makeSuccessEntry('replenish')
};

/* ============================================================================
   [EXTEND] 启动 —— hash 直达；新增页面私有逻辑写在下面
   ============================================================================ */
function boot() {
  elScreen    = document.getElementById('pdaScreen');
  elStatusbar = document.getElementById('pdaStatusbar');
  elNavbar    = document.getElementById('pdaNavbar');
  elContent   = document.getElementById('pdaContent');
  elActionbar = document.getElementById('pdaActionbar');
  elMask      = document.getElementById('pdaMask');
  elSheet     = document.getElementById('pdaSheet');
  elModal     = document.getElementById('pdaModal');
  elToast     = document.getElementById('pdaToast');
  elLed       = document.getElementById('pdaLed');

  state.warehouse = WAREHOUSES[0];
  state.stack = ['home'];
  state.page = 'home';

  /* hash 直达：#putaway-list 刷新后仍停在该页 */
  var h = (location.hash || '').replace('#', '');
  if (h && PAGES[h]) {
    state.page = h;
    state.stack = (PAGES[h].nav && PAGES[h].nav.back === false) ? [h] : ['home', h];
  }

  /* 唯一键盘确认入口：Enter / 回车；排除输入法组合输入 */
  elContent.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.keyCode !== 13) return;
    if (e.isComposing || e.keyCode === 229) return;
    var t = e.target;
    var inp = t && t.closest ? (t.closest('[data-scan-input]') || t.closest('[data-qty-input]')) : null;
    if (!inp) return;
    e.preventDefault();
    var id = inp.getAttribute('data-scan-input') || inp.getAttribute('data-qty-input');
    var fn = scanHandlers[id];
    if (typeof fn === 'function') fn(inp.value, inp);
  });

  /* 遮罩：点击关闭弹层 */
  elMask.addEventListener('click', function () { closeSheet(); closeModal(); });

  /* 浏览器 hash 变化（用户手改地址栏） */
  window.addEventListener('hashchange', function () {
    if (hashGuard) return;
    var k = (location.hash || '').replace('#', '');
    if (k && PAGES[k] && k !== state.page) {
      state.page = k;
      if (state.stack.indexOf(k) < 0) state.stack.push(k);
      state.scan.active = null;
      renderAll();
    }
  });

  /* 状态栏时钟 */
  setInterval(renderStatusbar, 30000);

  bindKeypad();
  switchPage(state.page);
  if (state.page === 'home') state.scan.active = null;
}

boot();
</script>
</body>
</html>
