<!--
================================================================================
  西之月店铺后台 · 原型页面模板  v2.0
  来源：外壳取自「新商城demo策略+物料计划.html」
        视觉令牌与组件命名对齐 WestMoon 真实后台（westmoon-admin-shell.css）
  用途：批量生成可交互的产品原型 demo（无 mock 数据，交互真实可用）
  形态：单文件 · 零外部依赖 · file:// 直接打开
================================================================================

  【三层结构】
  ┌ L0 固定层 FIXED ──────────────────────────────────────────────────────────
  │  · <style> 中所有 [FIXED] 段落：设计令牌 + 外壳 + 组件样式
  │  · <body> 里 topbar / app-shell / sidebar / main 骨架
  │  · <script> 中 [FIXED] 段落的渲染与交互代码
  │  → 禁止改动，改这些会破坏与参考原型的外观一致性。
  │  ★ 只换品牌主色：改 :root 里的 --primary-500 / --primary-600 / --primary-700
  ├ L1 数据层 REPLACE ────────────────────────────────────────────────────────
  │  · MENU        → 三层导航树：侧栏一级 + 侧栏二级 + 页头三级页签
  │  · SHOP_TYPES  → 右上角店铺/角色切换下拉的选项
  │  · WAREHOUSES  → 页签行右侧「仓库」作用域下拉的选项
  │  · PAGES       → 页面注册表（标题 / 面包屑 / 页头按钮 / 渲染函数）
  │  · state 初值  → 首屏定位到哪个菜单
  ├ L2 内容层 REPLACE ────────────────────────────────────────────────────────
  │  · 每个 render 函数返回的 HTML 字符串即页面主体
  │  · 只能使用模板已提供的组件 class（见「组件总览」页）
  │  · 需要新颜色/新间距 → 在 :root 加变量，不要在元素上内联颜色
  └ L3 扩展层 EXTEND ─────────────────────────────────────────────────────────
     · <style> 末尾 [EXTEND] 区：放页面私有样式
     · <script> 末尾 [EXTEND] 区：放页面私有逻辑

  【尺寸与色值】（对齐真实后台，改这里即可全站换皮）
  顶栏 54px · 侧栏 188px / 收起 64px · 圆角 卡片 8px、控件 6px、胶囊 999px
  主色 #6424fe · 浅底 #f3efff · 页面底 #f5f5f5 · 描边 #e5e5e5
  文本 #171717 · 次要 #687386 · 成功 #1f9d65 · 警告 #d97706 · 危险 #e5484d

  【可替换点速查】（这 5 处是模板里唯一需要改的固定文案）
  <title>          浏览器标题
  .brand-mark      左上角品牌图标（紫底 + 线性图标）
  .brand-title     品牌名 · .brand-sub 副标题
  #shopSwitcherLabel  店铺/角色默认文案（会被 SHOP_TYPES[0] 覆盖）
  .user-avatar     头像文字 1-2 字 · .user-name 用户名

  【导航分层】（对齐真实后台，改 MENU 即改变三层结构）
  侧栏一级 = MENU 数组的项（有 children 则可展开、可折叠）
  侧栏二级 = children[] 的项（点击即切页）
  页头页签 = 当前二级项的 children[]，即第三层
  二级项没有 children → 页头不出现页签行，切页只在侧栏发生。

  【新增一个页面的 4 步】
  1. 在 MENU 挂节点。二级叶子页：
       { label:'XX', icon:'package', children:[{ name:'XX管理', page:'xx-list' }] }
     二级容器 + 三级页签：
       { label:'XX', icon:'package', children:[
           { name:'XX管理', hideFromTertiaryTabs:true, children:[
               { name:'子页 A', page:'xx-a' }, { name:'子页 B', page:'xx-b' } ]} ]}
  2. 在 PAGES 注册：
     'xx-a': { title:'子页 A', breadcrumb:['XX','XX管理','子页 A'], actions:[…], render: () => listPage({…}) }
  3. （可选）用 listPage() / formPage() 套标准骨架，或直接返回自定义 HTML
  4. 刷新即可。CSS 一行都不用改，外观自动与其它页一致。

  【开箱可用的交互能力】（不用自己写）
  openDrawer(title, bodyHTML, footerHTML, mod) / closeDrawer()   mod: ''|'wide'|'editor'
  openModal(title, bodyHTML, footerHTML, mod)  / closeModal()    mod: ''|'editor'|'reference'
  toast('提示文案')
  switchPage('pageKey')                    跳转到指定页面
  listPage(cfg) / formPage(cfg)            标准页面骨架生成器
  statusTabs(cfg) / queryPanel(cfg)        状态页签 / 查询面板
  statusTag(text,type) / progressCell(n,total) / linkBtn(text,onclick)
  自动生效：侧栏收起与分组折叠 · 店铺下拉 · 仓库作用域下拉
           侧栏一级/二级高亮 · 页头三级页签切换 · 状态页签切换
           查询面板展开全部条件 · 表格全选与行选中
           表格吸左吸右固定列 · 开关 · 分段控件 · 通用下拉菜单 · ESC 关闭
           hash 直达（#xx-list 刷新后仍停在该页）
================================================================================
-->

  <style>
    /* ==========================================================================
       [FIXED-1] 设计令牌 —— 全站唯一颜色/尺寸来源，换肤只改这里
       ========================================================================== */
    :root {
      /* --- 品牌主色（对齐 WestMoon 真实后台 #6424fe） --- */
      --primary-50:   #f3efff;
      --primary-100:  #ece4ff;
      --primary-200:  #d9caff;
      --primary-400:  #8a5cff;
      --primary-500:  #6424fe;
      --primary-600:  #6424fe;
      --primary-700:  #4f1bcc;

      /* --- 中性色（对齐真实后台的 text / muted / border） --- */
      --gray-0:   #ffffff;
      --gray-50:  #f5f5f5;
      --gray-100: #f1f2f4;
      --gray-200: #e5e5e5;
      --gray-300: #d1d5db;
      --gray-400: #8a8f98;
      --gray-500: #687386;
      --gray-600: #545b68;
      --gray-700: #414753;
      --gray-800: #30343b;
      --gray-900: #171717;

      /* --- 语义色（对齐真实后台的 success / warning / danger） --- */
      --error-500:   #e5484d;
      --success-500: #1f9d65;
      --warning-500: #d97706;

      --warning-soft:  #fff7e6;
      --success-soft:  #eaf8f1;
      --danger-soft:   #fff0f0;
      --disabled-soft: #f1f2f4;

      --surface-sunken: #fafafa;
      --row-hover:      #fcfbff;
      --row-selected:   #f7f3ff;

      --topbar-height: 54px;
      --sidebar-width: 188px;
      --sidebar-collapsed-width: 64px;

      --radius-sm: 6px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --radius-pill: 999px;

      --shadow-sm:   0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md:   0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-soft: 0 1px 2px rgba(16, 12, 40, .04), 0 8px 22px rgba(74, 55, 150, .06);
      --shadow-lift: 0 12px 30px rgba(74, 55, 150, .13);
      --shadow-panel: 0 18px 48px rgb(0 0 0 / 14%);

      --ease: cubic-bezier(.2, .7, .3, 1);
      --transition-fast:   150ms ease;
      --transition-normal: 220ms ease;
    }

    /* ==========================================================================
       [FIXED-2] 基础重置
       ========================================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "微软雅黑", "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: var(--gray-900);
      background: var(--gray-50);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    a { color: inherit; text-decoration: none; }
    input[type="checkbox"] { accent-color: var(--primary-500); width: 14px; height: 14px; cursor: pointer; }
    select, input, textarea { font-family: inherit; }

    /* 线性图标统一尺寸；具体容器可覆盖 */
    .ui-icon { display: block; width: 18px; height: 18px; flex: 0 0 auto; }
    .muted { color: var(--gray-500); font-size: 13px; }

    /* ==========================================================================
       [FIXED-3] 顶部栏 Top Bar
       ========================================================================== */
    .topbar {
      position: fixed; inset: 0 0 auto 0;
      height: var(--topbar-height);
      background: var(--gray-0);
      border-bottom: 1px solid var(--gray-200);
      display: grid; align-items: center;
      grid-template-columns: 185px minmax(220px, 320px) minmax(0, 1fr);
      gap: 16px; padding: 0 12px;
      z-index: 100;
    }

    /* --- 品牌 --- */
    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }

    .brand-mark {
      width: 32px; height: 32px; flex: 0 0 auto;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
      display: flex; align-items: center; justify-content: center;
      color: #fff;
    }
    .brand-mark .ui-icon { width: 18px; height: 18px; }

    .brand-copy { display: grid; min-width: 0; }
    .brand-title {
      font-size: 19px; font-weight: 760; letter-spacing: -.6px;
      color: var(--gray-900); white-space: nowrap;
    }
    .brand-sub {
      margin-top: 1px; font-size: 9px; letter-spacing: 1.6px;
      color: var(--gray-400); white-space: nowrap;
    }

    /* --- 全局搜索 --- */
    .global-search {
      display: flex; align-items: center; gap: 8px; min-width: 0;
      height: 32px; padding: 0 10px;
      background: var(--gray-0);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
      color: var(--gray-500);
      transition: border-color var(--transition-fast);
    }
    .global-search:focus-within { border-color: var(--primary-500); }
    .global-search .ui-icon { width: 17px; height: 17px; }
    .global-search input {
      flex: 1; min-width: 0; height: 100%;
      border: 0; outline: 0; background: transparent;
      font-size: 13px; color: var(--gray-900);
    }
    .global-search input::placeholder { color: var(--gray-400); }
    .search-clear {
      width: 20px; height: 20px; flex: 0 0 auto;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--gray-400);
    }
    .search-clear:hover { background: var(--gray-100); color: var(--gray-600); }
    .search-clear .ui-icon { width: 13px; height: 13px; }

    /* --- 顶栏右侧工具区 --- */
    .topbar-tools {
      display: flex; align-items: center; justify-content: flex-end;
      gap: clamp(8px, 1vw, 16px); min-width: 0;
    }

    /* 品牌胶囊（可选：不需要就删掉这个 button） */
    .moonclaw-banner {
      flex: 0 0 auto; width: 180px; padding: 5px 12px; overflow: hidden;
      color: #91e9ff;
      background: linear-gradient(100deg, #061b5b, #070b45 55%, #24106e);
      border-radius: 20px;
      font-size: 12px; font-weight: 750; letter-spacing: 1px;
      text-align: left; text-overflow: ellipsis; white-space: nowrap;
    }
    .moonclaw-banner strong { color: #d8f8ff; font-size: 13px; letter-spacing: 1.5px; }

    .topbar-icon {
      position: relative; flex: 0 0 auto;
      width: 24px; height: 30px;
      display: grid; place-items: center;
      color: var(--primary-500);
    }
    .topbar-icon:hover { color: var(--primary-700); }
    .topbar-icon .ui-icon { width: 20px; height: 20px; }

    .notification-icon::after {
      content: ""; position: absolute; top: 2px; right: 0;
      width: 6px; height: 6px; border-radius: 50%; background: #ff5d5d;
    }

    /* 兼容旧类名：顶栏图标按钮 / 角标 */
    .topbar-action {
      width: 34px; height: 34px; flex: 0 0 auto;
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      color: var(--gray-500); position: relative;
      transition: all var(--transition-fast);
    }
    .topbar-action:hover { background: var(--gray-100); color: var(--gray-900); }
    .topbar .badge {
      position: absolute; top: 6px; right: 6px;
      min-width: 14px; height: 14px; padding: 0 4px;
      border-radius: 7px; background: var(--error-500);
      color: #fff; font-size: 10px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--gray-0);
    }

    /* --- 用户区 --- */
    .user-profile {
      display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
      padding: 2px 4px 2px 2px; border-radius: var(--radius-pill);
      cursor: pointer; transition: background var(--transition-fast);
    }
    .user-profile:hover { background: var(--gray-50); }
    .user-avatar {
      width: 34px; height: 34px; flex: 0 0 auto;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary-400), var(--primary-700));
      border: 2px solid var(--gray-100);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 13px; font-weight: 700;
    }
    .user-name {
      font-size: 13px; font-weight: 600; color: var(--gray-800);
      max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .profile-caret { width: 12px; height: 12px; color: var(--gray-500); }
    .profile-caret .ui-icon { width: 12px; height: 12px; }

    /* --- 店铺 / 角色切换器 --- */
    .shop-switcher { position: relative; flex: 0 0 auto; }

    .shop-switcher-trigger {
      display: inline-flex; align-items: center; gap: 6px;
      height: 32px; padding: 0 10px;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
      font-size: 13px; font-weight: 600;
      color: var(--gray-700);
      transition: all var(--transition-fast); white-space: nowrap;
    }
    .shop-switcher-trigger:hover { border-color: var(--primary-500); color: var(--primary-600); }
    .shop-switcher-trigger.active { border-color: var(--primary-500); color: var(--primary-600); background: var(--primary-50); }
    .shop-switcher-trigger .ui-icon { width: 14px; height: 14px; color: var(--gray-400); transition: transform var(--transition-fast); }
    .shop-switcher-trigger.active .ui-icon { transform: rotate(180deg); color: var(--primary-600); }

    .shop-switcher-menu {
      position: absolute; top: calc(100% + 6px); right: 0;
      min-width: 190px;
      background: var(--gray-0);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-panel);
      padding: 6px;
      opacity: 0; visibility: hidden;
      transform: translateY(-4px);
      transition: all var(--transition-fast);
      z-index: 120;
    }
    .shop-switcher-menu.open { opacity: 1; visibility: visible; transform: translateY(0); }

    .shop-switcher-item {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 9px 10px;
      border-radius: var(--radius-md);
      font-size: 13px; font-weight: 500;
      color: var(--gray-700);
      transition: all var(--transition-fast); text-align: left;
    }
    .shop-switcher-item:hover { background: var(--gray-50); color: var(--gray-900); }
    .shop-switcher-item.active { color: var(--primary-600); background: var(--primary-50); }
    .shop-switcher-check { width: 14px; height: 14px; color: var(--primary-600); display: flex; align-items: center; justify-content: center; }
    .shop-switcher-item:not(.active) .shop-switcher-check { visibility: hidden; }

    /* ==========================================================================
       [FIXED-4] 布局外壳 App Shell + 侧边栏
       ========================================================================== */
    .app-shell {
      display: flex;
      margin-top: var(--topbar-height);
      height: calc(100vh - var(--topbar-height));
    }

    .sidebar {
      position: fixed;
      top: var(--topbar-height); left: 0; bottom: 0;
      width: var(--sidebar-width);
      background: var(--gray-0);
      border-right: 1px solid var(--gray-200);
      display: flex; flex-direction: column;
      z-index: 90;
      transition: width var(--transition-normal);
      overflow: hidden;
    }
    .sidebar.collapsed { width: var(--sidebar-collapsed-width); }

    .sidebar-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 6px 8px 8px; }

    /* --- 一级菜单项 / 二级菜单项 --- */
    .nav-item, .nav-child {
      display: flex; align-items: center; width: 100%;
      text-align: left; white-space: nowrap;
      background: transparent; border-radius: var(--radius-md);
      transition: background var(--transition-fast), color var(--transition-fast);
    }
    .nav-item {
      min-height: 44px; padding: 0 8px; gap: 10px;
      font-size: 14px; font-weight: 550; color: var(--gray-800);
    }
    .nav-child {
      min-height: 38px; padding: 0 8px 0 35px;
      font-size: 13px; font-weight: 500; color: var(--gray-700);
    }
    .nav-item:hover, .nav-child:hover { background: var(--gray-50); }
    .nav-item.current, .nav-child.current { color: var(--primary-500); background: var(--primary-50); }

    .nav-icon { display: grid; place-items: center; width: 20px; flex: 0 0 auto; color: var(--gray-500); }
    .nav-icon .ui-icon { width: 17px; height: 17px; }
    .nav-item.current .nav-icon, .nav-child.current .nav-icon { color: var(--primary-500); }

    .nav-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }

    .nav-chevron { margin-left: auto; display: grid; place-items: center; color: var(--gray-400); transition: transform var(--transition-fast); }
    .nav-chevron .ui-icon { width: 14px; height: 14px; }
    .nav-item[aria-expanded="true"] .nav-chevron { transform: rotate(180deg); }

    .nav-children[hidden] { display: none; }

    .nav-divider { height: 1px; margin: 6px 8px; background: var(--gray-200); }

    /* 收起态：只留图标 */
    .sidebar.collapsed .nav-label,
    .sidebar.collapsed .nav-chevron,
    .sidebar.collapsed .nav-children,
    .sidebar.collapsed .nav-divider { display: none; }
    .sidebar.collapsed .nav-item { justify-content: center; padding: 0; }

    .sidebar-footer {
      display: flex; justify-content: flex-end; gap: 12px;
      padding: 8px 12px 6px; flex-shrink: 0;
      border-top: 1px solid var(--gray-100);
    }
    .sidebar-footer button {
      width: 24px; height: 28px;
      display: grid; place-items: center;
      color: var(--gray-500); border-radius: var(--radius-sm);
    }
    .sidebar-footer button:hover { background: var(--gray-100); color: var(--gray-800); }
    .sidebar-footer .ui-icon { width: 16px; height: 16px; }
    .collapse-icon { transition: transform var(--transition-fast); }
    .sidebar.collapsed .collapse-icon { transform: rotate(180deg); }

    .sidebar-overlay {
      position: fixed; inset: var(--topbar-height) 0 0 0;
      background: rgba(0, 0, 0, 0.3); z-index: 85;
      opacity: 0; pointer-events: none;
      transition: opacity var(--transition-fast);
    }
    .sidebar-overlay.show { opacity: 1; pointer-events: auto; }

    /* ==========================================================================
       [FIXED-5] 主内容区 / 页头页签 / 页体
       ========================================================================== */
    .main {
      flex: 1; margin-left: var(--sidebar-width);
      display: flex; flex-direction: column; min-width: 0;
      transition: margin-left var(--transition-normal);
    }
    .sidebar.collapsed ~ .main { margin-left: var(--sidebar-collapsed-width); }

    /* 页头 = 一级页签通栏 + 右侧作用域选择器 */
    .page-header {
      display: flex; align-items: center; gap: 24px;
      padding: 0 20px;
      background: var(--gray-0);
      border-bottom: 1px solid var(--gray-200);
      flex-shrink: 0;
    }

    /* 一级页签：白底通栏，active = 紫字 + 3px 紫色底线 */
    .tabs-row {
      display: flex; align-items: center; gap: 28px;
      flex: 1; min-width: 0;
      overflow-x: auto; scrollbar-width: none;
    }
    .tabs-row::-webkit-scrollbar { display: none; }

    .tab {
      position: relative; min-height: 54px; padding: 0 2px;
      font-size: 15px; color: var(--gray-900);
      white-space: nowrap; transition: color var(--transition-fast);
    }
    .tab:hover { color: var(--primary-600); }
    .tab.active { color: var(--primary-500); font-weight: 700; }
    .tab.active::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -1px;
      height: 3px; background: var(--primary-500); border-radius: 3px 3px 0 0;
    }

    /* 页签行右侧的作用域选择器（仓库 / 门店 / 组织） */
    .tabs-scope {
      display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
      color: var(--gray-500); font-size: 13px; white-space: nowrap;
    }
    .tabs-scope select {
      height: 32px; padding: 0 8px;
      background: var(--gray-0); color: var(--gray-800);
      border: 1px solid var(--gray-200); border-radius: var(--radius-md);
      font-size: 13px;
    }
    .tabs-scope select:focus-visible { border-color: var(--primary-500); outline: 2px solid var(--primary-50); }

    /* 页体：浅灰底，白色卡片浮在上面 */
    .page-body { flex: 1; padding: 20px; overflow: auto; background: var(--gray-50); }

    /* 页标题行 */
    .page-title-bar {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 16px; margin: 0 0 18px;
    }
    .page-title {
      font-size: 22px; font-weight: 700; color: var(--gray-900);
      letter-spacing: -.4px; flex: 1; min-width: 0;
    }
    .page-title-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    /* 隐藏页标题（列表页用二级页签当标题时用） */
    .page-title-bar.is-hidden { display: none; }
    .page-title-bar.is-title-hidden { justify-content: flex-end; }
    .page-title-bar.is-title-hidden .page-title { display: none; }

    /* ==========================================================================
       [FIXED-6] 空态
       ========================================================================== */
    .empty-state {
      display: grid; place-items: center;
      min-height: 280px; color: var(--gray-500); text-align: center;
    }
    .empty-icon {
      width: 54px; height: 54px;
      margin: 0 auto 14px;
      border-radius: 16px;
      background: var(--primary-50); color: var(--primary-500);
      display: grid; place-items: center;
    }
    .empty-icon svg { width: 24px; height: 24px; }
    .empty-title { font-size: 15px; font-weight: 650; color: var(--gray-700); margin-bottom: 6px; }
    .empty-desc { font-size: 13px; color: var(--gray-500); max-width: 420px; }

    /* ==========================================================================
       [FIXED-7] 通用组件
       ========================================================================== */

    /* --- 按钮 --- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 36px; padding: 0 13px;
      border-radius: var(--radius-md);
      border: 1px solid var(--gray-200);
      background: var(--gray-0); color: var(--gray-800);
      font-size: 13px; font-weight: 650;
      transition: border-color var(--transition-fast), color var(--transition-fast), background var(--transition-fast);
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--primary-500); color: var(--primary-600); }
    .btn.primary { background: var(--primary-500); border-color: var(--primary-500); color: #fff; }
    .btn.primary:hover { background: var(--primary-700); border-color: var(--primary-700); color: #fff; }
    .btn.ghost { background: transparent; border-color: transparent; color: var(--primary-600); }
    .btn.ghost:hover { background: var(--primary-50); border-color: transparent; }
    .btn.link {
      height: auto; min-height: 0; padding: 0;
      border: 0; background: transparent;
      color: var(--primary-600); font-weight: 500;
      text-decoration: underline; text-underline-offset: 2px;
    }
    .btn.link:hover { color: var(--primary-700); }
    .btn.danger { color: var(--error-500); }
    .btn.danger:hover { color: var(--error-500); border-color: var(--error-500); }
    .btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
    .btn[disabled], .btn[disabled]:hover {
      color: var(--gray-400); background: var(--gray-50); border-color: var(--gray-200);
      cursor: not-allowed;
    }
    .btn-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    /* 页头主按钮（与 .btn.primary 同色，保留原类名以兼容） */
    .page-action-btn {
      display: inline-flex; align-items: center; justify-content: center;
      height: 36px; padding: 0 13px; border-radius: var(--radius-md);
      border: 1px solid var(--primary-500); background: var(--primary-500); color: #fff;
      font-size: 13px; font-weight: 650; white-space: nowrap;
      transition: all var(--transition-fast);
    }
    .page-action-btn:hover { background: var(--primary-700); border-color: var(--primary-700); }

    /* --- 标签 Tag（胶囊） --- */
    .tag {
      display: inline-flex; align-items: center; height: 22px; padding: 0 8px;
      border-radius: var(--radius-pill);
      font-size: 12px; font-weight: 650;
      background: var(--disabled-soft); color: var(--gray-500);
    }
    .tag.purple { background: var(--primary-50); color: var(--primary-600); }
    .tag.green { background: var(--success-soft); color: var(--success-500); }
    .tag.amber { background: var(--warning-soft); color: var(--warning-500); }
    .tag.red { background: var(--danger-soft); color: var(--error-500); }

    /* --- 状态胶囊（表格单元格用，命名对齐真实后台） --- */
    .status {
      display: inline-flex; align-items: center;
      padding: 3px 8px; border-radius: var(--radius-pill);
      font-size: 12px; font-weight: 650;
      background: var(--disabled-soft); color: var(--gray-500);
    }
    .status.pending { color: var(--warning-500); background: var(--warning-soft); }
    .status.enabled { color: var(--success-500); background: var(--success-soft); }
    .status.disabled { color: var(--gray-400); background: var(--disabled-soft); }
    .status.rejected { color: var(--error-500); background: var(--danger-soft); }
    .status.info { color: var(--primary-600); background: var(--primary-50); }

    /* --- 面包屑 --- */
    .breadcrumb {
      display: flex; align-items: center; gap: 4px;
      padding: 12px 0 0;
      font-size: 12px; color: var(--gray-500);
    }
    .breadcrumb .sep { color: var(--gray-300); }
    .breadcrumb .cur { color: var(--gray-800); font-weight: 600; }

    /* --- 面板 / 卡片 --- */
    .panel {
      background: var(--gray-0);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 16px; border-bottom: 1px solid var(--gray-200);
    }
    .panel-head h3 { font-size: 16px; font-weight: 700; color: var(--gray-900); }
    .panel-head p { font-size: 12px; color: var(--gray-500); margin-top: 2px; }
    .panel-body { padding: 16px; }

    /* 整页卡片：列表页 / 表单页的外壳，浅灰页底上浮一张白卡 */
    .page-card {
      min-height: calc(100vh - var(--topbar-height) - 40px);
      padding: 20px;
      background: var(--gray-0);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
    }

    /* --- 查询面板（浅灰底 + 描边 + 3 列网格） --- */
    .query-panel {
      display: grid;
      grid-template-columns: repeat(3, minmax(150px, 1fr)) auto;
      align-items: end;
      gap: 12px;
      padding: 14px;
      margin-bottom: 14px;
      background: var(--surface-sunken);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
    }
    .query-panel.is-collapsed .field-extra { display: none; }
    .query-panel.is-collapsed .query-actions { grid-column: 1 / -1; justify-content: flex-end; }

    .field-group { display: grid; gap: 5px; min-width: 0; }
    .field-group > label { font-size: 12px; font-weight: 650; color: var(--gray-600); }
    .field-group.field-wide { grid-column: 1 / -1; }

    .date-range { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .date-range > span { flex: 0 0 auto; color: var(--gray-500); font-size: 12px; }
    .date-range .field { min-width: 0; }

    .query-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }

    .query-toggle {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 0 4px; border-radius: var(--radius-sm);
      color: var(--primary-600); font-size: 13px; white-space: nowrap;
    }
    .query-toggle:hover { color: var(--primary-700); }
    .query-toggle-icon { display: inline-flex; transition: transform var(--transition-fast); }
    .query-toggle-icon .ui-icon { width: 14px; height: 14px; }
    .query-toggle-icon.is-up { transform: rotate(180deg); }

    /* --- 表单控件 --- */
    .field {
      width: 100%; min-height: 36px; padding: 6px 10px;
      background: var(--gray-0);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
      font-size: 13px; color: var(--gray-900); outline: none;
      transition: border-color var(--transition-fast);
    }
    .field::placeholder { color: var(--gray-400); }
    .field:focus { border-color: var(--primary-500); box-shadow: 0 0 0 3px var(--primary-50); }
    select.field { cursor: pointer; padding-right: 8px; }

    /* 兼容旧写法：行内 label + 输入框 */
    .filter-bar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
      padding: 14px; margin-bottom: 14px;
      background: var(--surface-sunken);
      border: 1px solid var(--gray-200); border-radius: var(--radius-lg);
    }
    .filter-bar .spacer { flex: 1; }
    .filter-bar .field { width: auto; min-width: 150px; }

    .input {
      height: 36px; min-width: 150px; padding: 0 10px;
      border: 1px solid var(--gray-200); border-radius: var(--radius-md);
      font-size: 13px; color: var(--gray-900);
      background: var(--gray-0); outline: none;
      transition: all var(--transition-fast);
    }
    .input::placeholder { color: var(--gray-400); }
    .input:focus { border-color: var(--primary-500); box-shadow: 0 0 0 3px var(--primary-50); }
    select.input { padding-right: 26px; cursor: pointer; }
    textarea.input { height: auto; min-height: 92px; padding: 8px 10px; resize: vertical; line-height: 1.6; }

    .form-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 16px; }
    .form-row > label { font-size: 12px; font-weight: 650; color: var(--gray-600); }
    .form-row > label .req { color: var(--error-500); margin-left: 2px; }
    .form-row .hint { font-size: 12px; color: var(--gray-400); }
    .form-row .input, .form-row .field { width: 100%; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 24px; }
    .form-grid .form-row:last-child:nth-child(odd) { grid-column: 1 / -1; }

    /* 表单纵向堆叠（抽屉 / 弹窗内） */
    .form-stack { display: grid; gap: 14px; }
    .field-group > label .req { color: var(--error-500); margin-left: 2px; }

    /* 明细行编辑（编辑型抽屉里用） */
    .editor-child-row {
      display: flex; align-items: flex-end; gap: 8px;
      padding: 8px 0; border-bottom: 1px solid var(--gray-200);
    }
    .editor-child-row .field-group { flex: 1; min-width: 0; }
    .editor-child-row:last-of-type { border-bottom: 0; }

    /* --- 分段控件 --- */
    .seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--gray-100); border-radius: var(--radius-md); }
    .seg button { height: 28px; padding: 0 14px; border-radius: var(--radius-sm); font-size: 12px; color: var(--gray-600); transition: all var(--transition-fast); }
    .seg button:hover { color: var(--gray-900); }
    .seg button.active { background: var(--gray-0); color: var(--primary-600); font-weight: 600; box-shadow: var(--shadow-sm); }

    /* --- 状态页签（带计数，列表页顶部） --- */
    .status-tabs {
      display: flex; align-items: center; gap: 24px;
      margin-bottom: 16px;
      overflow-x: auto; scrollbar-width: none;
      border-bottom: 1px solid var(--gray-200);
    }
    .status-tabs::-webkit-scrollbar { display: none; }
    .tab-button {
      position: relative; padding: 10px 2px 12px;
      font-size: 14px; color: var(--gray-800);
      white-space: nowrap; background: transparent;
    }
    .tab-button:hover { color: var(--primary-600); }
    .tab-button.active { color: var(--primary-500); font-weight: 700; }
    .tab-button.active::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -1px;
      height: 2px; background: var(--primary-500);
    }
    .tab-count { margin-left: 5px; color: var(--gray-500); font-weight: 400; }

    /* --- 开关 --- */
    .switch {
      position: relative; width: 40px; height: 22px; flex-shrink: 0;
      border-radius: 11px; background: var(--gray-300);
      transition: background var(--transition-fast);
    }
    .switch::after {
      content: ""; position: absolute; top: 2px; left: 2px;
      width: 18px; height: 18px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .2);
      transition: transform var(--transition-fast);
    }
    .switch.on { background: var(--primary-600); }
    .switch.on::after { transform: translateX(18px); }
    .switch-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--gray-700); }

    /* --- 通用下拉菜单 --- */
    .dropdown { position: relative; display: inline-block; }
    .dropdown-menu {
      position: absolute; top: calc(100% + 4px); left: 0;
      min-width: 170px;
      background: var(--gray-0);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      box-shadow: 0 8px 24px -8px rgb(0 0 0 / 0.12);
      padding: 6px;
      opacity: 0; visibility: hidden; transform: translateY(-4px);
      transition: all var(--transition-fast);
      z-index: 120;
    }
    .dropdown-menu.open { opacity: 1; visibility: visible; transform: translateY(0); }
    .dropdown-item {
      display: block; width: 100%; text-align: left;
      padding: 8px 10px; border-radius: var(--radius-md);
      font-size: 13px; color: var(--gray-700);
      transition: all var(--transition-fast);
    }
    .dropdown-item:hover { background: var(--gray-50); color: var(--gray-900); }

    /* --- 操作栏 --- */
    .action-bar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 12px;
    }
    .action-bar .spacer { flex: 1; }
    .selected-count { font-size: 12px; color: var(--gray-500); }
    .selected-count b { color: var(--primary-600); }

    /* 按钮组：操作栏内横排；表格单元格内是 3 列网格（见 .dt 段落） */
    .row-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

    /* --- 数据表格 --- */
    .table-wrap {
      width: 100%; max-width: 100%; overflow: auto;
      background: var(--gray-0);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      scrollbar-width: thin;
    }
    .table-wrap::-webkit-scrollbar { height: 10px; width: 10px; }
    .table-wrap::-webkit-scrollbar-track { background: #f2f2f2; }
    .table-wrap::-webkit-scrollbar-thumb { background: #d8d8d8; border-radius: 5px; }
    .table-wrap::-webkit-scrollbar-thumb:hover { background: #c4c4c4; }

    .dt { width: 100%; min-width: 940px; border-collapse: collapse; font-size: 13px; background: var(--gray-0); }
    .dt th, .dt td {
      padding: 11px 12px; text-align: left; vertical-align: middle;
      border-bottom: 1px solid var(--gray-200);
    }
    .dt th {
      background: var(--surface-sunken); color: var(--gray-600);
      font-size: 12px; font-weight: 650; white-space: nowrap;
    }
    .dt tbody tr:last-child td { border-bottom: 0; }
    .dt tbody tr:hover td { background: var(--row-hover); }
    .dt tbody tr.selected td { background: var(--row-selected); }

    /* 固定列：横向滚动时复选框列吸左、操作列吸右 */
    .dt th.sticky-col-left, .dt td.sticky-col-left {
      position: sticky; left: 0; z-index: 2;
      background: var(--gray-0);
      box-shadow: 6px 0 8px -8px rgb(15 23 42 / .3);
    }
    .dt th.sticky-col-right, .dt td.sticky-col-right {
      position: sticky; right: 0; z-index: 2;
      background: var(--gray-0);
      box-shadow: -6px 0 8px -8px rgb(15 23 42 / .3);
    }
    .dt th.sticky-col-left, .dt th.sticky-col-right { z-index: 3; background: var(--surface-sunken); }
    .dt tbody tr:hover td.sticky-col-left, .dt tbody tr:hover td.sticky-col-right { background: var(--row-hover); }
    .dt tbody tr.selected td.sticky-col-left, .dt tbody tr.selected td.sticky-col-right { background: var(--row-selected); }

    .dt .col-check { width: 44px; padding-left: 14px; padding-right: 0; }
    .dt .col-num { font-variant-numeric: tabular-nums; text-align: right; }
    .dt .col-strong { font-weight: 650; color: var(--gray-900); }
    .dt .col-muted { color: var(--gray-500); }
    .dt .col-block { display: block; }

    /* 操作列：一行最多 3 个操作，多的自动换到下一行 */
    .dt td.col-act { white-space: nowrap; }
    .dt td .row-actions {
      display: grid; grid-template-columns: repeat(3, max-content);
      align-items: center; justify-content: start; gap: 6px 14px;
    }
    .dt td .row-actions .btn.link { justify-self: start; }

    /* 单元格内链接（单据号等） */
    .dt .cell-link {
      color: var(--primary-600); font-weight: 650;
      text-decoration: underline; text-underline-offset: 2px;
      background: transparent; padding: 0;
    }
    .dt .cell-link:hover { color: var(--primary-700); }

    /* 进度条单元格 */
    .progress-cell { display: inline-flex; align-items: center; min-width: 132px; gap: 6px; }
    .progress-track { flex: 1 1 auto; height: 6px; overflow: hidden; background: var(--gray-200); border-radius: 3px; }
    .progress-fill { display: block; height: 100%; background: var(--primary-500); border-radius: 3px; }
    .progress-cell.is-over .progress-fill { background: var(--error-500); }
    .progress-text { flex: 0 0 auto; color: var(--gray-500); font-size: 12px; white-space: nowrap; }

    .dt-empty td, .dt-empty:hover td {
      text-align: center; padding: 56px 12px; color: var(--gray-500); background: none;
    }
    .dt-empty .empty-mini-title { display: block; font-size: 14px; font-weight: 650; color: var(--gray-700); margin-bottom: 4px; }
    .dt-empty .empty-mini-desc { display: block; font-size: 12px; color: var(--gray-500); }

    /* --- 分页 --- */
    .pager-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 0 0; flex-wrap: wrap;
    }
    .pager-total { font-size: 12px; color: var(--gray-500); }
    .pager { display: flex; align-items: center; gap: 4px; }
    .pager button {
      min-width: 30px; height: 30px; padding: 0 8px;
      border-radius: var(--radius-sm); border: 1px solid var(--gray-200);
      font-size: 12px; color: var(--gray-700); background: var(--gray-0);
      transition: all var(--transition-fast);
    }
    .pager button:hover { border-color: var(--primary-500); color: var(--primary-600); }
    .pager button.active { background: var(--primary-50); border-color: var(--primary-200); color: var(--primary-600); font-weight: 650; }
    .pager button[disabled] { color: var(--gray-400); border-color: var(--gray-200); background: var(--gray-50); cursor: not-allowed; }

    /* --- 详情块（抽屉 / 弹窗里用） --- */
    .detail-section { padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--gray-200); }
    .detail-section:last-child { padding-bottom: 0; margin-bottom: 0; border-bottom: 0; }
    .detail-section > h3 { font-size: 15px; font-weight: 700; color: var(--gray-900); margin-bottom: 12px; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; }
    .detail-item dt { margin-bottom: 4px; color: var(--gray-500); font-size: 12px; }
    .detail-item dd { margin: 0; color: var(--gray-900); font-size: 13px; word-break: break-all; }

    /* --- 操作日志 --- */
    .log-item { padding: 10px 0 10px 14px; border-left: 2px solid var(--primary-100); }
    .log-item p { margin-bottom: 4px; font-size: 13px; color: var(--gray-800); }
    .log-item .log-meta { font-size: 12px; color: var(--gray-500); }

    .icon-button {
      display: grid; place-items: center;
      width: 34px; height: 34px; flex: 0 0 auto;
      background: var(--gray-0); color: var(--gray-600);
      border: 1px solid var(--gray-200); border-radius: var(--radius-md);
      transition: all var(--transition-fast);
    }
    .icon-button:hover { border-color: var(--primary-500); color: var(--primary-600); }
    .icon-button .ui-icon { width: 16px; height: 16px; }

    /* --- 统计卡 --- */
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 12px; }
    .metric {
      padding: 14px 16px;
      background: var(--gray-0);
      border: 1px solid var(--gray-200); border-radius: var(--radius-lg);
      transition: transform .2s var(--ease), box-shadow .2s var(--ease);
    }
    .metric:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
    .metric .label { font-size: 12px; color: var(--gray-500); }
    .metric .value { margin-top: 6px; font-size: 26px; font-weight: 700; color: var(--gray-900); letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
    .metric .hint { margin-top: 4px; font-size: 12px; color: var(--gray-400); }

    /* --- 流程步骤 --- */
    .steps { display: flex; flex-wrap: wrap; gap: 8px; }
    .steps .step {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px;
      background: var(--gray-0); border: 1px solid var(--gray-200); border-radius: var(--radius-lg);
      font-size: 13px; color: var(--gray-500);
    }
    .steps .step .n {
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--gray-100); color: var(--gray-500);
      font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .steps .step.done { border-color: var(--primary-200); background: var(--primary-50); color: var(--primary-700); }
    .steps .step.done .n, .steps .step.active .n { background: var(--primary-600); color: #fff; }
    .steps .step.active { border-color: var(--primary-500); color: var(--primary-700); box-shadow: var(--shadow-sm); }

    /* --- 提示条 --- */
    .hint-banner {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 14px;
      background: var(--primary-50); border: 1px solid var(--primary-200);
      border-radius: var(--radius-lg);
      font-size: 13px; color: var(--primary-700);
    }
    .hint-banner.info { background: var(--gray-50); border-color: var(--gray-200); color: var(--gray-600); }

    .divider { height: 1px; background: var(--gray-100); margin: 20px 0; }

    /* ==========================================================================
       [FIXED-8] 抽屉与弹窗
       ========================================================================== */
    .drawer-mask {
      position: fixed; inset: 0; background: rgba(17, 24, 39, .4);
      z-index: 200;
      display: flex; justify-content: flex-end;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity .26s var(--ease), visibility .26s var(--ease);
    }
    .drawer-mask.show { opacity: 1; visibility: visible; pointer-events: auto; }

    .drawer {
      width: min(720px, 96vw); height: 100%;
      background: var(--gray-0);
      display: flex; flex-direction: column;
      transform: translateX(26px);
      transition: transform 220ms var(--ease);
    }
    .drawer-mask.show .drawer { transform: translateX(0); }
    .drawer.narrow { width: min(560px, 96vw); }
    .drawer.wide { width: min(1120px, 92vw); }
    /* 编辑型抽屉：灰底 + 白色分区卡（对齐真实后台 editor-drawer） */
    .drawer.editor { width: min(960px, 72vw); background: #f2f2f2; }
    .drawer.editor .drawer-body { display: flex; flex-direction: column; gap: 14px; padding: 16px; }
    .editor-section { padding: 0 18px 20px; background: var(--gray-0); border-radius: var(--radius-md); }
    .editor-section h3 {
      padding: 16px 0 12px; margin: 0 0 16px;
      border-bottom: 1px solid var(--gray-200);
      font-size: 16px; font-weight: 700; color: var(--gray-900);
    }
    .editor-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 24px; }
    .editor-grid .field-group:last-child:nth-child(odd) { grid-column: 1 / -1; }

    .drawer-header, .modal-header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 18px 20px; border-bottom: 1px solid var(--gray-200); flex-shrink: 0;
    }
    .drawer-title, .modal-title { font-size: 16px; font-weight: 700; color: var(--gray-900); }
    .panel-close {
      width: 30px; height: 30px; flex: 0 0 auto;
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      color: var(--gray-500); font-size: 16px; line-height: 1;
      transition: all var(--transition-fast);
    }
    .panel-close:hover { background: var(--gray-100); color: var(--gray-900); }

    .drawer-body { flex: 1; overflow: auto; padding: 20px; }
    .drawer-footer, .modal-footer {
      padding: 14px 20px; border-top: 1px solid var(--gray-200);
      display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-shrink: 0;
    }
    .drawer-footer .muted, .modal-footer .muted { margin-right: auto; }

    .modal-mask {
      position: fixed; inset: 0; background: rgba(17, 24, 39, .4);
      z-index: 210; padding: 24px;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity .2s var(--ease), visibility .2s var(--ease);
    }
    .modal-mask.show { opacity: 1; visibility: visible; pointer-events: auto; }
    .modal {
      width: min(480px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
      background: var(--gray-0); border-radius: var(--radius-lg);
      display: flex; flex-direction: column; overflow: hidden;
      transform: translateY(8px) scale(.98);
      transition: transform 200ms var(--ease);
    }
    .modal.editor { width: min(760px, calc(100vw - 32px)); }
    .modal.reference { width: min(1040px, calc(100vw - 32px)); }
    .modal.reference .modal-body { max-height: calc(100vh - 220px); overflow: auto; }
    .modal-mask.show .modal { transform: none; }
    .modal-body { flex: 1; overflow: auto; padding: 20px; }

    /* ==========================================================================
       [FIXED-9] 轻提示 Toast
       ========================================================================== */
    .toast-wrap {
      position: fixed; right: 20px; bottom: 20px;
      z-index: 300;
      display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
      pointer-events: none;
    }
    .toast {
      max-width: min(420px, calc(100vw - 40px));
      background: #24262b; color: #fff;
      font-size: 13px; padding: 12px 16px;
      border-radius: 7px; box-shadow: var(--shadow-panel);
      opacity: 0; transform: translateY(6px);
      transition: all 200ms var(--ease);
    }
    .toast.show { opacity: 1; transform: none; }

    /* ==========================================================================
       [FIXED-10] 响应式
       ========================================================================== */

    @media (max-width: 900px) {
      .topbar { grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; padding: 0 10px; }
      .brand-sub { display: none; }
      .moonclaw-banner { display: none; }

      /* 移动端侧栏改为抽屉式；收起态此时不隐藏文字 */
      .sidebar { transform: translateX(-100%); width: var(--sidebar-width); }
      .sidebar.mobile-open { transform: translateX(0); }
      .sidebar.collapsed { width: var(--sidebar-width); }
      .sidebar.collapsed .nav-label { display: block; }
      .sidebar.collapsed .nav-chevron { display: grid; }
      .sidebar.collapsed .nav-children { display: block; }
      .sidebar.collapsed .nav-children[hidden] { display: none; }
      .sidebar.collapsed .nav-divider { display: block; }
      .sidebar.collapsed .nav-item { justify-content: flex-start; padding: 0 8px; }

      .main, .sidebar.collapsed ~ .main { margin-left: 0; }
      .user-name { display: none; }
      .page-header { padding: 0 14px; gap: 12px; }
      .tab { min-height: 48px; font-size: 14px; }
      .tabs-row { gap: 20px; }
      .page-body { padding: 12px; }
      .page-card { min-height: 0; padding: 14px; }

      .query-panel { grid-template-columns: 1fr; }
      .query-panel .query-actions { grid-column: 1 / -1; justify-content: flex-end; }
      .field-group.field-time { grid-column: auto; }

      .form-grid { grid-template-columns: 1fr; }
      .form-grid .form-row:last-child:nth-child(odd) { grid-column: auto; }
      .metrics { grid-template-columns: repeat(2, minmax(130px, 1fr)); }
      .drawer, .drawer.editor, .drawer.wide { width: 100%; }
    }

    @media (max-width: 520px) {
      .user-name, .profile-caret { display: none; }
      .brand-title { font-size: 17px; }
      .page-title-bar { align-items: stretch; flex-direction: column; }
      .detail-grid { grid-template-columns: 1fr; }
      .editor-grid { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: 1fr; }
      .query-toggle { font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 1ms !important; animation-duration: 1ms !important; }
    }

    sub: 0,          /* 三级下标 */

  /** 某个二级项对应的「页头三级页签」列表
   *  hideFromTertiaryTabs 为 true → 只列 children；否则 [自身, ...children]
   *  没有 children → 空数组（页头不出页签行） */
  function tabsOf(child) {
    if (!child || !child.children || !child.children.length) return [];
    return child.hideFromTertiaryTabs ? child.children.slice() : [child].concat(child.children);
  }

  /** 解析当前菜单节点：一级 → 二级 → 三级，返回当前页面 key、标题与页头三级页签 */
  function currentNode() {
    var g = MENU[state.top];
    if (!g) return { group: null, child: null, level3: null, pageKey: null, title: '', tabs: [] };
    var c = (g.children && g.children[state.tab]) || null;
    if (!c) {
      return { group: g, child: null, level3: null, pageKey: g.page || null, title: g.label, tabs: [] };
    }
    var list = tabsOf(c);
    var cur = list.length ? (list[state.sub] || list[0]) : c;
    return {
      group: g, child: c,
      level3: list.length ? cur : null,
      tabs: list,
      pageKey: cur.page || null,
      title: cur.name || c.name
    };
  }

        + (hasKids ? ' aria-expanded="' + expanded + '"' : '')
        + '>'
        + '<span class="nav-icon">' + (ICONS[g.icon] || ICONS.home) + '</span>'
        + '<span class="nav-label">' + g.label + '</span>'
        + (hasKids ? '<span class="nav-chevron">' + ICONS.chevronDown + '</span>' : '')
        + '</button>';

      if (hasKids) {
        html += '<div class="nav-children"' + (expanded ? '' : ' hidden') + '>'
          + g.children.map(function (c, j) {
              var cur = (i === state.top && j === state.tab);
              return '<button class="nav-child' + (cur ? ' current' : '') + '"'
                + ' data-si="' + i + '" data-ti="' + j + '">' + c.name + '</button>';
            }).join('')
          + '</div>';
      }

      if (i < MENU.length - 1) html += '<div class="nav-divider"></div>';
    });

    el.innerHTML = html;

    el.querySelectorAll('.nav-item').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var i = parseInt(btn.dataset.si, 10);
        var g = MENU[i];
        /* 收起态下点一级菜单：先把侧栏展开，再切换分组 */
        if (state.collapsed) toggleSidebar(false);
        if (g.children && g.children.length) {
          var cur = (state.open[i] === undefined) ? (i === state.top) : state.open[i];
          state.open[i] = !cur;
        }
        state.top = i; state.tab = 0; state.sub = 0;
        renderAll();
        if (window.innerWidth <= 900) closeMobileSidebar();
      });
    });

    el.querySelectorAll('.nav-child').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.top = parseInt(btn.dataset.si, 10);
        state.tab = parseInt(btn.dataset.ti, 10);
        state.sub = 0;
        renderAll();
        if (window.innerWidth <= 900) closeMobileSidebar();
      });
    });
  }

  /* 注：原「顶栏二级导航」（#topNav + SHOW_TOP_NAV_SUBNAV + renderTopNav）已删除。
     导航只有两处出口：侧栏承载一级 + 二级，页头页签行承载三级。
     再挂一处二级导航会与侧栏二级菜单重复。 */

  /** 页头三级页签行（右侧的「仓库」作用域下拉常驻）
   *  数据源 = 当前二级项的 children（见 tabsOf），不是侧栏二级菜单的复刻。
   *  二级项无 children → 隐藏页签行，切页只在侧栏发生。 */
  var tabsVisible = false;

  function renderTabs() {
    var el = document.getElementById('tabsRow');
    var g = MENU[state.top];
    var c = (g && g.children && g.children[state.tab]) || null;
    var list = tabsOf(c);
    var show = list.length >= 2;
    tabsVisible = show;

    if (!show) { el.innerHTML = ''; el.style.display = 'none'; return; }
    el.style.display = '';
    el.innerHTML = list.map(function (t, i) {
      return '<button class="tab' + (i === state.sub ? ' active' : '') + '" data-sti="' + i + '">' + t.name + '</button>';
    }).join('');
    el.querySelectorAll('.tab').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.sub = parseInt(btn.dataset.sti, 10); renderAll();
      });
    });
  }

  /** 页签右侧的作用域下拉 */
  function renderWarehouseSelect() {
    var el = document.getElementById('warehouseSelect');
    if (!el) return;
    el.innerHTML = WAREHOUSES.map(function (w) {
      return '<option' + (w === state.warehouse ? ' selected' : '') + '>' + w + '</option>';
    }).join('');
    el.onchange = function () {
      state.warehouse = el.value;
      toast('已切换到「' + state.warehouse + '」');
    };
  }

  /* 注：原「三级 subtab 行」（#subtabsRow）已删除。
     三级导航现在只由页头的 renderTabs() 承担，与真实后台的 tertiary-tabs 一致，
     避免同一层级出现两套并行机制。 */

  /** 页面主体 */
  function renderPage() {
    var node = currentNode();
    var page = node.pageKey ? PAGES[node.pageKey] : null;
    var titleEl   = document.getElementById('pageTitle');
    var actionsEl = document.getElementById('pageTitleActions');
    var emptyEl   = document.getElementById('emptyState');
    var contentEl = document.getElementById('pageContent');
    var barEl     = document.getElementById('pageTitleBar');

    titleEl.textContent = (page && page.title) || node.title || '';

    /* 面包屑 */
    var bcEl = document.getElementById('pageBreadcrumb');
    var bc = (page && page.breadcrumb) || null;
    if (bc && bc.length) {
      bcEl.innerHTML = bc.map(function (t, i, arr) {
        return i === arr.length - 1
          ? '<span class="cur">' + t + '</span>'
          : '<span>' + t + '</span><span class="sep">›</span>';
      }).join('');
      bcEl.style.display = 'flex';
    } else {
      bcEl.innerHTML = '';
      bcEl.style.display = 'none';
    }
    document.getElementById('pageBody').classList.toggle('has-breadcrumb', !!(bc && bc.length));

    /* 页头按钮 */
    var actions = (page && page.actions) || [];
    if (actions.length) {
      actionsEl.style.display = 'flex';
      actionsEl.innerHTML = actions.map(function (a, i) {
        return '<button class="btn' + (a.primary ? ' primary' : '') + '" data-act="' + i + '">' + a.label + '</button>';
      }).join('');
      actionsEl.querySelectorAll('[data-act]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var a = actions[parseInt(btn.dataset.act, 10)];
          if (a && typeof a.action === 'function') a.action();
        });
      });
    } else {
      actionsEl.innerHTML = '';
      actionsEl.style.display = 'none';
    }

    /* 标题栏：标题与当前页签同名时自动隐藏（避免与页签重复）；两者都为空则整行隐藏 */
    var autoDedupe = !!(tabsVisible && node.title && (!page || !page.title || page.title === node.title));
    var hideTitle = !!(page && page.hideTitle) || autoDedupe;
    barEl.classList.toggle('is-title-hidden', hideTitle);
    barEl.classList.toggle('is-hidden', !!(page && page.hideTitleAll) || (hideTitle && actions.length === 0));

    /* 主体内容 or 空态 */
    if (page && typeof page.render === 'function') {
      contentEl.innerHTML = page.render() || '';
      contentEl.style.display = '';
      emptyEl.style.display = 'none';
      /* ⚠ 不要在这里再绑一次委托：#pageContent 是 #pageBody 的子节点，
         boot() 已在 #pageBody 上绑好一次。重复绑定会让每次点击冒泡经过
         两层监听器，切换类处理器（查询面板展开/开关/下拉）执行两遍而自我抵消。 */
      /* 支持 render 里返回 { html } 之外的自定义挂载钩子 */
      if (typeof page.mounted === 'function') page.mounted(contentEl);
    } else {
      contentEl.innerHTML = '';
      contentEl.style.display = 'none';
      emptyEl.style.display = 'grid';
      document.getElementById('emptyTitle').textContent = (node.title || '页面') + ' - 内容占位';
      document.getElementById('emptyDesc').textContent =
        '当前位于「' + (node.group ? node.group.label : '')
        + (node.child ? ' / ' + node.child.name : '')
        + (node.level3 ? ' / ' + node.level3.name : '')
        + '」，页面的具体内容待填充。';
      emptyEl.querySelector('.empty-icon').innerHTML = EMPTY_ICON_SVG;
    }
  }

  function renderAll() {
    renderSidebar();
    renderTabs();
    renderWarehouseSelect();
    renderPage();
  }

  /* ============================================================================
     [FIXED] 通用交互工具 —— 页面里可直接用
     ============================================================================ */

  /* 页面跳转（带 hash，刷新后停在同一页）—— 按一级 → 二级 → 三级逐层查找 */
  function switchPage(key) {
    for (var i = 0; i < MENU.length; i++) {
      var g = MENU[i];
      if (g.page === key) { state.top = i; state.tab = 0; state.sub = 0; afterRoute(key); return; }
      var cs = g.children || [];
      for (var j = 0; j < cs.length; j++) {
        var c = cs[j];
        if (c.page === key) { state.top = i; state.tab = j; state.sub = 0; afterRoute(key); return; }
        var list = tabsOf(c);
        for (var k = 0; k < list.length; k++) {
          if (list[k].page === key) { state.top = i; state.tab = j; state.sub = k; afterRoute(key); return; }
        }
      }
    }
    toast('未找到页面：' + key);
  }
  function afterRoute(key) {
    try { location.hash = key; } catch (e) {}
    renderAll();
  }

  /* 抽屉：mod 可选 'narrow' | 'wide' | 'editor'（true 等同 'editor'） */
  function openDrawer(title, bodyHTML, footerHTML, mod) {
    var d = document.getElementById('drawer');
    document.getElementById('drawerTitle').textContent = title || '';
    document.getElementById('drawerBody').innerHTML = bodyHTML || '';
    var f = document.getElementById('drawerFooter');
    f.innerHTML = footerHTML || '';
    f.style.display = footerHTML ? 'flex' : 'none';
    d.classList.remove('narrow', 'wide', 'editor');
    if (mod === true) d.classList.add('editor');
    else if (typeof mod === 'string' && mod) d.classList.add(mod);
    document.getElementById('drawerMask').classList.add('show');
    bindTableInteractions(d);
  }
  function closeDrawer() { document.getElementById('drawerMask').classList.remove('show'); }

  /* 弹窗：mod 可选 'editor' | 'reference' */
  function openModal(title, bodyHTML, footerHTML, mod) {
    var m = document.querySelector('#modalMask .modal');
    document.getElementById('modalTitle').textContent = title || '';
    document.getElementById('modalBody').innerHTML = bodyHTML || '';
    var f = document.getElementById('modalFooter');
    f.innerHTML = footerHTML || '';
    f.style.display = footerHTML ? 'flex' : 'none';
    m.classList.remove('editor', 'reference');
    if (typeof mod === 'string' && mod) m.classList.add(mod);
    document.getElementById('modalMask').classList.add('show');
    bindTableInteractions(document.getElementById('modalMask'));
  }
  function closeModal() { document.getElementById('modalMask').classList.remove('show'); }

  /* 轻提示 */
  function toast(msg) {
    var wrap = document.getElementById('toastWrap');
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    wrap.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('show'); });
    setTimeout(function () {
      el.classList.remove('show');
      setTimeout(function () { el.remove(); }, 220);
    }, 2000);
  }

  /* 表格与表单控件的通用委托（在任意容器上调用即可生效） */
  function bindTableInteractions(root) {
    if (!root || root.dataset.bound === '1') return;
    root.dataset.bound = '1';

    root.addEventListener('click', function (e) {
      /* 全选 */
      var all = e.target.closest('.dt-select-all');
      if (all) {
        var table = all.closest('table');
        table.querySelectorAll('tbody .dt-row-check').forEach(function (cb) {
          cb.checked = all.checked;
          cb.closest('tr').classList.toggle('selected', all.checked);
        });
        updateSelectedCount(root);
        return;
      }
      /* 行选中 */
      var rowCheck = e.target.closest('.dt-row-check');
      if (rowCheck) {
        rowCheck.closest('tr').classList.toggle('selected', rowCheck.checked);
        updateSelectedCount(root);
        return;
      }
      /* 开关 */
      var sw = e.target.closest('.switch');
      if (sw) { sw.classList.toggle('on'); return; }
      /* 分段控件 */
      var segBtn = e.target.closest('.seg button');
      if (segBtn) {
        var seg = segBtn.parentElement;
        seg.querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
        segBtn.classList.add('active');
        return;
      }
      /* 状态页签（带计数） */
      var statusTab = e.target.closest('.tab-button');
      if (statusTab) {
        var tabsBox = statusTab.closest('.status-tabs');
        tabsBox.querySelectorAll('.tab-button').forEach(function (b) { b.classList.remove('active'); });
        statusTab.classList.add('active');
        return;
      }
      /* 查询面板：展开 / 收起全部条件 */
      var qToggle = e.target.closest('.query-toggle');
      if (qToggle) {
        var qPanel = qToggle.closest('.query-panel');
        var collapsed = qPanel.classList.toggle('is-collapsed');
        qToggle.setAttribute('aria-expanded', String(!collapsed));
        var qIcon = qToggle.querySelector('.query-toggle-icon');
        if (qIcon) qIcon.classList.toggle('is-up', !collapsed);
        var qLabel = qToggle.querySelector('.query-toggle-label');
        if (qLabel) {
          var extra = qPanel.dataset.extra || '0';
          qLabel.textContent = collapsed ? ('展开全部条件（' + extra + '）') : '收起全部条件';
        }
        return;
      }
      /* 通用下拉 */
      var ddTrigger = e.target.closest('[data-dropdown]');
      if (ddTrigger) {
        var menu = ddTrigger.parentElement.querySelector('.dropdown-menu');
        var open = menu.classList.contains('open');
        document.querySelectorAll('.dropdown-menu.open').forEach(function (m) { m.classList.remove('open'); });
        if (!open) menu.classList.add('open');
        e.stopPropagation();
        return;
      }
      /* 分页高亮 */
      var pagerBtn = e.target.closest('.pager button');
      if (pagerBtn && !pagerBtn.disabled) {
        pagerBtn.parentElement.querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
        pagerBtn.classList.add('active');
        return;
      }
    });

    root.addEventListener('change', function (e) {
      if (e.target.closest('.dt-select-all')) {
        var table = e.target.closest('table');
        table.querySelectorAll('tbody .dt-row-check').forEach(function (cb) {
          cb.checked = e.target.checked;
          cb.closest('tr').classList.toggle('selected', e.target.checked);
        });
        updateSelectedCount(root);
      }
      if (e.target.closest('.dt-row-check')) {
        e.target.closest('tr').classList.toggle('selected', e.target.checked);
        updateSelectedCount(root);
      }
    });
  }
  function updateSelectedCount(root) {
    document.querySelectorAll('.selected-count b').forEach(function (b) {
      var panel = b.closest('.panel');
      var n = panel ? panel.querySelectorAll('.dt-row-check:checked').length : 0;
      b.textContent = n;
    });
  }

  /* ============================================================================
     [FIXED] 可复用积木生成器 —— 全部返回 HTML 字符串，直接拼进 render()
     ============================================================================ */

  /* 把函数存进注册表，按钮上用 onclick="runHandler('h1')" 调用 */
  var HANDLERS = {};
  var handlerSeq = 0;
  function on(fn) {
    if (typeof fn !== 'function') return '';
    var id = 'ph' + (++handlerSeq);
    HANDLERS[id] = fn;
    return "runHandler('" + id + "')";
  }
  function runHandler(id) {
    var fn = HANDLERS[id];
    if (typeof fn === 'function') fn();
  }

  /** 状态页签（带计数）
   *  statusTabs({ tabs:[{ label:'待上架', count:3, active:true }] }) */
  function statusTabs(cfg) {
    cfg = cfg || {};
    var tabs = cfg.tabs || [];
    if (!tabs.length) return '';
    return '<div class="status-tabs">'
      + tabs.map(function (t, i) {
          var hasCount = (t.count !== undefined && t.count !== null && t.count !== '');
          return '<button class="tab-button' + (t.active ? ' active' : '') + '" data-status-tab="' + i + '">'
            + t.label
            + (hasCount ? '<span class="tab-count">' + t.count + '</span>' : '')
            + '</button>';
        }).join('')
      + '</div>';
  }

  /** 状态胶囊：statusTag('待上架', 'pending')
   *  类型：pending | enabled | disabled | rejected | info | '' */
  function statusTag(text, type) {
    return '<span class="status ' + (type || 'disabled') + '">' + text + '</span>';
  }

  /** 进度单元格：progressCell(已上架数量, 计划数量) */
  function progressCell(done, total) {
    var d = Number(done) || 0;
    var t = Number(total) || 0;
    var pct = t > 0 ? Math.min(100, Math.round(d / t * 100)) : 0;
    return '<span class="progress-cell' + (d > t ? ' is-over' : '') + '">'
      + '<span class="progress-track"><span class="progress-fill" style="width:' + pct + '%"></span></span>'
      + '<span class="progress-text">' + d + ' / ' + t + '</span>'
      + '</span>';
  }

  /** 单元格链接（单据号等）：linkCell('PAT-0001', function(){ toast('打开详情'); }) */
  function linkCell(text, fn) {
    return '<button class="cell-link" type="button" onclick="'
      + (fn ? on(fn) : on(function () { toast('打开「' + text + '」详情（原型示意）'); }))
      + '">' + text + '</button>';
  }

  /** 查询面板
   *  queryPanel({ fields:[{ label, type, placeholder, options, extra, span }], extra:16, collapsed:true })
   *  type：text | select | date | daterange */
  function queryPanel(cfg) {
    cfg = cfg || {};
    var fields = cfg.fields || [];
    var extraCount = (cfg.extra === undefined)
      ? fields.filter(function (f) { return f.extra; }).length
      : cfg.extra;
    var collapsed = cfg.collapsed !== false;

    var fieldsHTML = fields.map(function (f, i) {
      var cls = ['field-group'];
      if (f.extra) cls.push('field-extra');
      if (f.span === 'full') cls.push('field-wide');
      if (f.type === 'daterange' || f.span === 2) cls.push('field-time');

      var ctrl = '';
      if (f.type === 'select') {
        ctrl = '<select class="field" aria-label="' + f.label + '">'
          + (f.options || ['全部']).map(function (o) { return '<option>' + o + '</option>'; }).join('')
          + '</select>';
      } else if (f.type === 'daterange') {
        var t = (f.native === false) ? 'text' : 'datetime-local';
        ctrl = '<div class="date-range">'
          + '<input class="field" type="' + t + '" aria-label="' + f.label + ' 开始">'
          + '<span>至</span>'
          + '<input class="field" type="' + t + '" aria-label="' + f.label + ' 结束">'
          + '</div>';
      } else if (f.type === 'date') {
        ctrl = '<input class="field" type="date" aria-label="' + f.label + '">';
      } else {
        ctrl = '<input class="field" type="text" placeholder="' + (f.placeholder || '') + '" aria-label="' + f.label + '">';
      }

      return '<div class="' + cls.join(' ') + '"><label>' + f.label + '</label>' + ctrl + '</div>';
    }).join('');

    var toggle = extraCount > 0
      ? '<button class="query-toggle" type="button" aria-expanded="' + (!collapsed) + '">'
        + '<span class="query-toggle-label">'
        + (collapsed ? '展开全部条件（' + extraCount + '）' : '收起全部条件')
        + '</span>'
        + '<span class="query-toggle-icon' + (collapsed ? '' : ' is-up') + '">' + ICONS.chevronDown + '</span>'
        + '</button>'
      : '';

    return '<form class="query-panel' + (collapsed && extraCount > 0 ? ' is-collapsed' : '') + '"'
      + ' data-extra="' + extraCount + '" onsubmit="return false;">'
      + fieldsHTML
      + '<div class="query-actions">'
      +   '<button class="btn primary" type="submit" onclick="' + on(function () { toast('已按条件查询（原型示意）'); }) + '">查询</button>'
      +   '<button class="btn" type="button" onclick="' + on(function () { toast('已重置查询条件'); }) + '">重置</button>'
      +   toggle
      + '</div>'
      + '</form>';
  }

  /** 操作栏：actionBar({ buttons:[{label,primary,ghost,disabled,action}], note:'当前为管理员数据范围', showCount:true }) */
  function actionBar(cfg) {
    cfg = cfg || {};
    var buttons = cfg.buttons || [];
    if (!buttons.length && !cfg.note && !cfg.showCount) return '';
    return '<div class="action-bar">'
      + '<div class="row-actions">'
      +   buttons.map(function (b) {
            var cls = 'btn' + (b.primary ? ' primary' : '') + (b.ghost ? ' ghost' : '') + (b.link ? ' link' : '');
            return '<button class="' + cls + '" type="button"' + (b.disabled ? ' disabled' : '')
              + (b.action ? ' onclick="' + on(b.action) + '"' : '') + '>' + b.label + '</button>';
          }).join('')
      + '</div>'
      + (cfg.showCount ? '<span class="selected-count">已选 <b>0</b> 项</span>' : '')
      + (cfg.note ? '<span class="muted">' + cfg.note + '</span>' : '')
      + '</div>';
  }

  /** 分页条 */
  function pagerBar(total) {
    return '<div class="pager-bar">'
      + '<span class="pager-total">共 ' + (total || 0) + ' 条</span>'
      + '<div class="pager">'
      +   '<button disabled>上一页</button><button class="active">1</button><button disabled>下一页</button>'
      + '</div>'
      + '</div>';
  }

  /* ============================================================================
     [FIXED] 标准页面骨架生成器 —— 默认无 mock 数据，只给结构 + 空态
     ============================================================================ */

  /**
   * 标准列表页
   * cfg = {
   *   breadcrumb    面包屑写在 PAGES[key].breadcrumb，不在这里
   *   statusTabs    [{ label, count, active }]                 顶部状态页签
   *   filters       [{ label, type, placeholder, options, extra, span }]
   *   extraCount    额外条件数量（不传则按 filters 里 extra:true 的条数计算）
   *   filtersCollapsed  默认 true（默认收起，只显示常用条件）
   *   toolbar       [{ label, primary, ghost, disabled, action }]
   *   scopeNote     操作栏右侧说明，默认「当前为 XX仓 数据范围」
   *   showCount     是否显示「已选 N 项」
   *   columns       [{ key, label, width, align:'right', fixed:true }]  fixed 列吸右
   *   rows          可选：二维数组，每个单元格是 HTML 字符串；不传则显示空态
   *   emptyTitle / emptyDesc
   * }
   */
  function listPage(cfg) {
    cfg = cfg || {};
    var cols = cfg.columns || [];
    var filters = cfg.filters || [];

    var tabsHTML = statusTabs({ tabs: cfg.statusTabs || [] });

    var queryHTML = filters.length ? queryPanel({
      fields: filters,
      extra: cfg.extraCount,
      collapsed: cfg.filtersCollapsed
    }) : '';

    var note = (cfg.scopeNote === undefined)
      ? ('当前为 ' + state.warehouse + ' 数据范围')
      : cfg.scopeNote;

    var actionsHTML = actionBar({
      buttons: cfg.toolbar || [],
      note: note,
      showCount: !!cfg.showCount
    });

    var thHTML = '<th class="col-check sticky-col-left"><input type="checkbox" class="dt-select-all" aria-label="全选"></th>'
      + cols.map(function (c) {
          var style = (c.width ? 'width:' + c.width + ';' : '')
            + (c.align === 'right' ? 'text-align:right;' : '');
          return '<th' + (c.fixed ? ' class="sticky-col-right"' : '') + ' style="' + style + '">' + c.label + '</th>';
        }).join('');

    var emptyRow = '<tr class="dt-empty"><td colspan="' + (cols.length + 1) + '">'
      + '<span class="empty-mini-title">' + (cfg.emptyTitle || '暂无数据') + '</span>'
      + '<span class="empty-mini-desc">' + (cfg.emptyDesc || '当前筛选条件下没有任何记录。') + '</span>'
      + '</td></tr>';

    var rows = cfg.rows || [];
    var bodyHTML = rows.length
      ? rows.map(function (row) {
          return '<tr>'
            + '<td class="sticky-col-left"><input type="checkbox" class="dt-row-check" aria-label="选择该行"></td>'
            + row.map(function (cell, ci) {
                var c = cols[ci] || {};
                var cls = [];
                if (c.align === 'right') cls.push('col-num');
                if (c.fixed) cls.push('col-act sticky-col-right');
                if (c.cls) cls.push(c.cls);
                var html = (cell && typeof cell === 'object') ? (cell.html || '') : (cell == null ? '' : String(cell));
                return '<td' + (cls.length ? ' class="' + cls.join(' ') + '"' : '') + '>' + html + '</td>';
              }).join('')
            + '</tr>';
        }).join('')
      : emptyRow;

    return ''
      + '<div class="page-card">'
      +   tabsHTML
      +   queryHTML
      +   actionsHTML
      +   '<div class="table-wrap"><table class="dt">'
      +     '<thead><tr>' + thHTML + '</tr></thead>'
      +     '<tbody>' + bodyHTML + '</tbody>'
      +   '</table></div>'
      +   pagerBar(rows.length)
      + '</div>';
  }

  /**
   * 标准表单页
   * cfg = { sections:[{ title, fields:[{label,type,span,required,placeholder,options,on,hint}] }] }
   * type: text | select | textarea | switch
   */
  function formPage(cfg) {
    cfg = cfg || {};

    var sections = (cfg.sections || []).map(function (s) {
      var fields = (s.fields || []).map(function (f) {
        var label = '<label>' + f.label + (f.required ? '<span class="req">*</span>' : '') + '</label>';
        var ctrl = '';
        if (f.type === 'select') {
          ctrl = '<select class="input">' + (f.options || ['请选择']).map(function (o) { return '<option>' + o + '</option>'; }).join('') + '</select>';
        } else if (f.type === 'textarea') {
          ctrl = '<textarea class="input" placeholder="' + (f.placeholder || '') + '"></textarea>';
        } else if (f.type === 'switch') {
          ctrl = '<div class="switch-row"><span class="switch' + (f.on ? ' on' : '') + '"></span><span>' + (f.on ? '已启用' : '已关闭') + '</span></div>';
        } else {
          ctrl = '<input class="input" placeholder="' + (f.placeholder || '') + '">';
        }
        var hint = f.hint ? '<span class="hint">' + f.hint + '</span>' : '';
        return '<div class="form-row"' + (f.span === 2 ? ' style="grid-column:1 / -1;"' : '') + '>' + label + ctrl + hint + '</div>';
      }).join('');
      return '<div class="panel" style="margin-bottom:16px;">'
        + '<div class="panel-head"><h3>' + s.title + '</h3></div>'
        + '<div class="panel-body"><div class="form-grid">' + fields + '</div></div>'
        + '</div>';
    }).join('');

    return sections;
  }

     [FIXED] 事件绑定与启动
     ============================================================================ */

  /* 店铺切换器 */
  function renderShopSwitcher() {
    document.getElementById('shopSwitcherLabel').textContent = state.shopType;
    var menu = document.getElementById('shopSwitcherMenu');
    menu.innerHTML = SHOP_TYPES.map(function (t) {
      return '<button class="shop-switcher-item' + (t === state.shopType ? ' active' : '') + '" data-type="' + t + '">'
        + '<span>' + t + '</span>'
        + '<span class="shop-switcher-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>'
        + '</button>';
    }).join('');
    menu.querySelectorAll('.shop-switcher-item').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.shopType = btn.dataset.type;
        closeShopSwitcher();
        renderShopSwitcher();
        toast('已切换到「' + state.shopType + '」');
      });
    });
  }
  function closeShopSwitcher() {
    document.getElementById('shopSwitcherMenu').classList.remove('open');
    document.getElementById('shopSwitcherTrigger').classList.remove('active');
  }
  document.getElementById('shopSwitcherTrigger').addEventListener('click', function (e) {
    e.stopPropagation();
    var open = document.getElementById('shopSwitcherMenu').classList.toggle('open');
    document.getElementById('shopSwitcherTrigger').classList.toggle('active', open);
  });
  document.addEventListener('click', function (e) {
    if (!document.getElementById('shopSwitcher').contains(e.target)) closeShopSwitcher();
    if (!e.target.closest('.dropdown')) {
      document.querySelectorAll('.dropdown-menu.open').forEach(function (m) { m.classList.remove('open'); });
    }
  });

  /* 侧栏收起 / 移动端 */
  function toggleSidebar(force) {
    state.collapsed = (typeof force === 'boolean') ? force : !state.collapsed;
    document.getElementById('sidebar').classList.toggle('collapsed', state.collapsed);
  }
  document.getElementById('collapseBtn').addEventListener('click', function () { toggleSidebar(); });
  document.getElementById('helpBtn').addEventListener('click', function () { toast('帮助中心（原型示意）'); });

  /* 全局搜索：输入高亮 + 清空 */
  var globalSearchEl = document.getElementById('globalSearch');
  globalSearchEl.addEventListener('input', function () {
    document.querySelector('.global-search').classList.toggle('has-query', !!globalSearchEl.value);
  });
  document.getElementById('globalSearchClear').addEventListener('click', function () {
    globalSearchEl.value = '';
    document.querySelector('.global-search').classList.remove('has-query');
    globalSearchEl.focus();
  });

  function openMobileSidebar() {
    document.getElementById('sidebar').classList.add('mobile-open');
    document.getElementById('sidebarOverlay').classList.add('show');
  }
  function closeMobileSidebar() {
    document.getElementById('sidebar').classList.remove('mobile-open');
    document.getElementById('sidebarOverlay').classList.remove('show');
  }
  document.getElementById('sidebarOverlay').addEventListener('click', closeMobileSidebar);

  /* 遮罩点击关闭抽屉 / 弹窗；ESC 关闭 */
  document.getElementById('drawerMask').addEventListener('click', function (e) {
    if (e.target === this) closeDrawer();
  });
  document.getElementById('modalMask').addEventListener('click', function (e) {
    if (e.target === this) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeDrawer(); closeModal(); closeShopSwitcher(); }
  });

  /* 移动端菜单按钮 */
  var MOBILE_BREAKPOINT = 900;
  function injectMobileToggle() {
    var brand = document.querySelector('.brand');
    var existing = document.getElementById('mobileMenuBtn');
    if (window.innerWidth <= MOBILE_BREAKPOINT && !existing) {
      var btn = document.createElement('button');
      btn.id = 'mobileMenuBtn';
      btn.className = 'topbar-action';
      btn.style.width = '28px';
      btn.style.height = '28px';
      btn.title = '菜单';
      btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>';
      btn.addEventListener('click', openMobileSidebar);
      brand.insertBefore(btn, brand.firstChild);
    } else if (window.innerWidth > MOBILE_BREAKPOINT && existing) {
      existing.remove();
      closeMobileSidebar();
    }
  }
  window.addEventListener('resize', injectMobileToggle);

  /* ============================================================================
     [EXTEND] 启动 —— 支持 hash 直达；新增页面私有逻辑写在下面
     ============================================================================ */
  (function boot() {
    injectMobileToggle();
    /* 默认定位：MENU 第一项 */
    state.top = 0; state.tab = 0; state.sub = 0;

    var hash = (location.hash || '').replace('#', '');
    if (hash) {
      for (var i = 0; i < MENU.length; i++) {
        var g = MENU[i];
        if (g.page === hash) { state.top = i; hash = ''; break; }
        var cs = g.children || [];
        for (var j = 0; j < cs.length; j++) {
          var c = cs[j];
          if (c.page === hash) { state.top = i; state.tab = j; hash = ''; break; }
          var list = tabsOf(c);
          for (var k = 0; k < list.length; k++) {
            if (list[k].page === hash) { state.top = i; state.tab = j; state.sub = k; hash = ''; break; }
          }
          if (!hash) break;
        }
        if (!hash) break;
      }
    }

    renderShopSwitcher();
    /* 委托只绑这一次，绑在 #pageBody 上（它包住 #pageContent，且永不被替换）。
       抽屉 / 弹窗在 #pageBody 之外，各自在 open 时单独绑。 */
    bindTableInteractions(document.getElementById('pageBody'));
    renderAll();
  })();
  </script>
</body>
</html>
