<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>【标题】· 【副标题或日期】</title>
<!--
  汇报材料模板 · 蓝灰文档站
  来源：库存模型设计.html（西之月 WMS TDD），2026-10-30 定为本工作区汇报标准。

  用法：复制本文件，按【】占位替换，删除不需要的 section。
  纪律（见 docs/specs/03-汇报材料设计规范.md）：
    1. 骨架不动骨架五件套：sidebar 目录、sec-kicker 眉标、count 角标、lead 导语、panel 白卡。
    2. 内容块只用模板已有类：panel / concl / table / badge / link-list / num / prog。
       不要新增 .cards / .card 这类自造容器，那就是换了一套样式。
    3. 类名不得复用冲突。.lead 只给页首导语用，卡片内的说明段落用普通 <p>。
    4. 不放交互按钮（打印/PDF 等），浏览器自带。
    5. 不放装饰性元信息（"单文件·无外部依赖""本页是…版本"等）。
-->
<style>
:root{--bg:#f7f8fa;--card:#fff;--line:#dce2eb;--soft:#edf0f5;--ink:#1a2636;--muted:#67758a;--blue:#2f6db5;--bluebg:#eef4fb;--teal:#0f6e56;--amber:#986611}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:24px}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
a{-webkit-tap-highlight-color:transparent}a:focus-visible{outline:3px solid #85addd;outline-offset:3px}a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
.layout{max-width:1376px;margin:auto;display:grid;grid-template-columns:215px minmax(0,1fr);gap:34px;padding:36px 28px 72px}
.sidebar{min-width:0;align-self:start;position:sticky;top:24px;font-size:13px}
.brand{font-size:12px;letter-spacing:.1em;color:var(--muted);margin-bottom:18px}
.sidebar nav a{display:block;padding:8px 11px;margin:3px 0;border-radius:7px;color:#5f6f82}
.sidebar nav a.active{background:#e7eef8;color:var(--blue);font-weight:600}
main{min-width:0;max-width:1080px}
h1{font-size:28px;font-weight:650;margin:0 0 7px;letter-spacing:-.5px}
h2{font-size:20px;font-weight:600;margin:0}
h3{font-size:15px;font-weight:600;margin:0 0 8px}
p{margin:0 0 12px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:#f0f3f7;padding:2px 5px;border-radius:4px;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px}
.topbar{display:flex;justify-content:space-between;align-items:start;gap:12px}
.lead{background:var(--bluebg);border:1px solid #cfdef1;border-left:3px solid #82a9d6;border-radius:8px;padding:16px 18px;margin:14px 0 22px;color:#284f7c}
.section{margin:36px 0 0}
.sec-head{border-bottom:1px solid var(--line);padding-bottom:12px;margin:0 0 17px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sec-kicker{font-size:11px;color:var(--muted);letter-spacing:.12em;margin-bottom:3px}
.count{color:var(--muted);font-size:12px;white-space:nowrap}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:21px 23px;margin-bottom:14px}
.concl{background:var(--bluebg);border-left:3px solid #84a9d2;border-radius:0 6px 6px 0;padding:11px 14px;margin-bottom:15px;color:#284f7c}
.concl.ok{background:#eaf6f0;border-color:#77b69c;color:#23624f}
.concl.warn{background:#fdf5e6;border-color:#d4b06c;color:#785819}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px;margin:9px 0 13px}
th,td{padding:10px 11px;text-align:left;border-bottom:1px solid var(--soft);vertical-align:top}
th{color:#5f6f82;font-weight:500;background:#f7f9fc}
tr:last-child td{border-bottom:0}
td p{margin:0}
.col-no{width:44px;white-space:nowrap}
.col-prog{width:66px;white-space:nowrap;text-align:right}
.col-pri{width:64px;white-space:nowrap}
.col-own{width:170px}
.col-who{width:110px;white-space:nowrap}
.col-when{width:88px;white-space:nowrap}
.cell-title{font-weight:600;display:block;margin-bottom:3px}
.num{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;background:var(--bluebg);color:var(--blue);font-size:12px;font-weight:600}
.prog{font-variant-numeric:tabular-nums;font-weight:600;color:#315a89}
.badge{display:inline-block;font-size:11px;border:1px solid #c9dbef;color:#416d9d;background:#f1f6fc;border-radius:5px;padding:1px 7px;white-space:nowrap}
.badge.high{border-color:#e0c3c3;color:#94504f;background:#fdf1f1}
.badge.mid{border-style:dashed;color:#7a8594;background:#fafbfc}
.link-list{display:flex;flex-direction:column;gap:2px;font-size:12px}
.footer{font-size:11px;color:#7e8a9b;margin-top:20px}
@media(max-width:1000px){
  .layout{grid-template-columns:minmax(0,1fr);padding:24px 20px;gap:16px}
  .sidebar{position:static}
  .brand{display:none}
  .sidebar nav{display:flex;overflow:auto;border-bottom:1px solid var(--line);padding-bottom:8px;white-space:nowrap}
  .sidebar nav a{font-size:12px}
  .topbar{display:block}
}
@media(max-width:600px){
  .layout{padding:17px 13px 48px}
  .panel{padding:17px 15px}
  h1{font-size:24px}
}
@media print{
  body{background:#fff}
  .layout{display:block;padding:0}
  .sidebar{display:none!important}
  .panel{break-inside:avoid}
  main{max-width:none}
  .section{margin-top:24px}
  a{color:inherit}
  table{font-size:10px}
}
</style>
</head>
<body>
<div class="layout">

<!-- 左侧目录：条目数 = 正文 section 数，编号两位，全角空格分隔 -->
<aside class="sidebar">
  <div class="brand">WESTMOON · 【栏目名】</div>
  <nav aria-label="页面目录">
    <a href="#s1">01　【第一节标题】</a>
    <a href="#s2">02　【第二节标题】</a>
    <a href="#s3">03　【第三节标题】</a>
  </nav>
</aside>

<main>

<header>
  <div class="topbar">
    <div>
      <h1>【主标题】</h1>
      <p class="sub">【日期或范围】· 【模块或范围】</p>
    </div>
  </div>
  <!-- 导语：一句话说清全文结论，不要写成目录复述 -->
  <div class="lead">【一句话结论】</div>
</header>

<!-- ========== 表格型 section（周报、清单、状态汇报用这个） ========== -->
<section id="s1" class="section">
  <div class="sec-head">
    <div>
      <div class="sec-kicker">01 / 【英文眉标】</div>
      <h2>【节标题】</h2>
    </div>
    <span class="count">【数量或一句话提要】</span>
  </div>

  <div class="panel">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-no">序号</th>
            <th>【主内容列】</th>
            <th style="width:150px">【链接列】</th>
            <th class="col-prog">【进度列】</th>
            <th style="width:270px">【备注列】</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><span class="num">1</span></td>
            <td><span class="cell-title">【小标题】</span>【正文】</td>
            <td><div class="link-list"><a href="#">【文件名】</a></div></td>
            <td class="col-prog"><span class="prog">85%</span></td>
            <td>【风险或遗留问题】</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<!-- ========== 结论条型 section（讲一条结论 + 证据） ========== -->
<section id="s2" class="section">
  <div class="sec-head">
    <div>
      <div class="sec-kicker">02 / 【英文眉标】</div>
      <h2>【节标题】</h2>
    </div>
    <span class="count">【提要】</span>
  </div>

  <div class="panel">
    <!-- concl 三态：默认蓝=陈述，.ok 绿=已达成，.warn 黄=有风险 -->
    <div class="concl warn">【这条结论】</div>
    <p class="sub">【补充说明，可删】</p>
  </div>
</section>

<!-- ========== 三列简表 section ========== -->
<section id="s3" class="section">
  <div class="sec-head">
    <div>
      <div class="sec-kicker">03 / 【英文眉标】</div>
      <h2>【节标题】</h2>
    </div>
    <span class="count">【提要】</span>
  </div>

  <div class="panel">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>【事项】</th>
            <th class="col-pri">【优先级】</th>
            <th class="col-own">【负责人】</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>【任务】</td>
            <td class="col-pri"><span class="badge high">高</span></td>
            <td class="col-own">@【姓名】</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<footer class="footer">【署名】· 【日期】</footer>

</main>
</div>

<script>
'use strict';
/* 目录滚动跟随高亮。section 的 id 必须与 nav 内的 href 对应。 */
const sections = [...document.querySelectorAll('main>section')];
const nav = [...document.querySelectorAll('.sidebar nav a')];
const observer = new IntersectionObserver((entries) => {
  for (const e of entries) {
    if (e.isIntersecting) {
      for (const a of nav) a.classList.toggle('active', a.hash === '#' + e.target.id);
    }
  }
}, { rootMargin: '-8% 0px -68% 0px' });
sections.forEach((s) => observer.observe(s));
</script>
</body>
</html>
